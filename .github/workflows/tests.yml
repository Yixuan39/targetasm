name: Tests

on:
  push:
    branches: [dev, main, master]
  pull_request:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: nf-core/setup-nextflow@v2.1.4
        with:
          version: '26.04.3'
          java-version: '21'
          all: 'true'
      - uses: nf-core/setup-nf-test@v1
        with:
          version: '0.9.4'
      - name: Check Nextflow syntax
        run: nextflow lint main.nf workflows subworkflows/local modules/local conf nextflow.config
      - name: Check report parsing
        run: python3 -m unittest discover -s tests -p 'test_*.py'
      - name: Check report container runtime
        run: |
          report_images=$(sed -n "s/^    container '\(.*\)'$/\1/p" modules/local/quality_reports.nf | sort -u)
          test -n "$report_images"
          for report_image in $report_images; do
            docker run --rm "$report_image" sh -c 'command -v ps && python3 --version'
          done
      - name: Check pipeline wiring
        run: |
          nextflow run main.nf --help
          python3 tests/run_stub.py
      - name: Install tools for the read filtering regression
        run: |
          sudo apt-get update
          sudo apt-get install -y samtools tabix
      - name: Check real read filtering
        run: nf-test test tests/filter.nf.test --ci
